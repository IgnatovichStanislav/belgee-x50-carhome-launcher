# Builds the APK and the Magisk module on every v* tag and attaches both to a GitHub release.
# Optional signing secrets: CARHOME_KEYSTORE_BASE64, CARHOME_KEYSTORE_PASSWORD, CARHOME_KEY_ALIAS,
# CARHOME_KEY_PASSWORD. Without them the APK is signed with a throwaway debug key.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARHOME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CARHOME_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          CARHOME_KEYSTORE_PASSWORD: ${{ secrets.CARHOME_KEYSTORE_PASSWORD }}
          CARHOME_KEY_ALIAS: ${{ secrets.CARHOME_KEY_ALIAS }}
          CARHOME_KEY_PASSWORD: ${{ secrets.CARHOME_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest

      - name: Magisk module
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          STAGE="$RUNNER_TEMP/module"
          cp -r magisk "$STAGE"
          mkdir -p "$STAGE/system/priv-app/BGCarHome"
          cp "$APK" "$STAGE/system/priv-app/BGCarHome/BGCarHome.apk"
          mkdir -p dist
          cp "$APK" dist/
          (cd "$STAGE" && zip -r -X "$GITHUB_WORKSPACE/dist/bg-car-home-magisk-module.zip" .)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: bg-car-home
          path: dist/*
