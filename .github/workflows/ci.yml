# Builds the debug APK and runs unit and screenshot tests on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # release.yml handles tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      - name: Screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/home-*.png
          retention-days: 7
